name: Actualizar valores liquidativos
on:
  schedule:
    - cron: '30 7,13,19 * * 1-5'   # días laborables, 3 veces (los fondos publican con 1-2 días de retraso)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: nav-update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-nav.mjs
      - name: Guardar cambios
        run: |
          git config user.name "nav-bot"
          git config user.email "nav-bot@users.noreply.github.com"
          git add data/nav.json data/nav-history.json
          git diff --cached --quiet || git commit -m "Actualizar valores liquidativos"
          git push
